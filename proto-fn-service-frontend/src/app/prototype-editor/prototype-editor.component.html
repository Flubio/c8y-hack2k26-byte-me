<div class="pfn-chat">
  <div class="pfn-header">
    <img class="pfn-logo" [src]="byteMeLogo" alt="Byte Me" />
    <div>
      <div class="pfn-eyebrow"><span class="pfn-eyebrow-dot"></span> Prototype studio</div>
      <h4>Ask for a service</h4>
    </div>
    <button
      type="button"
      class="btn btn-link btn-sm pfn-clear-btn"
      *ngIf="messages.length > 0"
      (click)="clearChat()"
      title="Clear chat history"
    >
      Clear
    </button>
  </div>

  <div class="pfn-messages">
    <div *ngIf="messages.length === 0" class="pfn-empty">
      Describe what your microservice should do, e.g. "Show the average temperature
      per floor over the last 24 hours."
    </div>
    <div *ngFor="let message of messages" class="pfn-message" [class.is-user]="message.role === 'user'">
      <div class="pfn-bubble" *ngIf="message.role === 'user'">{{ message.content }}</div>
      <div class="pfn-bubble pfn-markdown" *ngIf="message.role !== 'user'" [innerHTML]="message.content | markdown"></div>
    </div>
    <div *ngIf="isSending" class="pfn-message">
      <div class="pfn-bubble pfn-bubble-loading">Thinking&hellip;</div>
    </div>
  </div>

  <div class="pfn-input-row">
    <textarea class="form-control" rows="2" [(ngModel)]="chatInput" [disabled]="isSending" (keydown)="handleChatKeydown($event)" placeholder="Describe what your microservice should do..."></textarea>
    <button type="button" class="btn btn-primary" (click)="sendChat()" [disabled]="!chatInput.trim() || isSending">
      Send
    </button>
  </div>

  <!-- <button type="button" class="btn btn-default btn-sm pfn-widget-btn" (click)="openWidgetDialog()">
    Create Cockpit widget
  </button> -->
</div>
